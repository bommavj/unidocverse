# Interview Q&A eval cases
# Each case: id, category, question, expected_keywords, min_score, tags

cases:
  - id: tc_001
    category: system_design
    question: "Design a URL shortener like bit.ly for 100M users/day."
    expected_keywords:
      - "hash"
      - "database"
      - "cache"
      - "load balancer"
      - "replication"
    min_score: 3
    tags: [system_design, senior, scale]

  - id: tc_002
    category: concurrency
    question: "Explain the difference between a mutex and a semaphore in production use."
    expected_keywords:
      - "mutual exclusion"
      - "counting"
      - "blocking"
      - "deadlock"
    min_score: 3
    tags: [os, concurrency, swe]

  - id: tc_003
    category: llm
    question: "What is RAG and how would you implement it at scale with 10M documents?"
    expected_keywords:
      - "retrieval"
      - "embedding"
      - "vector"
      - "chunk"
      - "semantic search"
    min_score: 4
    tags: [llm, ml, senior]

  - id: tc_004
    category: database
    question: "When would you choose DynamoDB over PostgreSQL? Give production trade-offs."
    expected_keywords:
      - "partition key"
      - "ACID"
      - "schema"
      - "throughput"
      - "consistency"
    min_score: 3
    tags: [database, aws, senior]

  - id: tc_005
    category: distributed
    question: "Explain the CAP theorem with a real incident from production."
    expected_keywords:
      - "consistency"
      - "availability"
      - "partition"
      - "trade-off"
    min_score: 3
    tags: [distributed, system_design, architect]

  - id: tc_006
    category: algorithms
    question: "Find the top K frequent elements in a stream. Optimal time and space complexity."
    expected_keywords:
      - "heap"
      - "frequency"
      - "O(n log k)"
      - "hash map"
    min_score: 4
    tags: [dsa, algorithms, competitive]

  - id: tc_007
    category: kafka
    question: "How does Kafka guarantee exactly-once delivery? What breaks it in practice?"
    expected_keywords:
      - "idempotent producer"
      - "transactions"
      - "offset"
      - "consumer group"
      - "at-least-once"
    min_score: 3
    tags: [kafka, streaming, senior]

  - id: tc_008
    category: security
    question: "What is jailbreaking in LLMs and how do you defend against prompt injection in production?"
    expected_keywords:
      - "prompt injection"
      - "system prompt"
      - "guardrails"
      - "input validation"
    min_score: 3
    tags: [llm, security, senior]
