version: '3.8'

services:

  # ── 1. Database ─────────────────────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    container_name: unidocverse-postgres
    environment:
      POSTGRES_USER: unidocverse
      POSTGRES_PASSWORD: unidocverse
      POSTGRES_DB: unidocverse_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unidocverse -d unidocverse_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 2048M

  # ── 2. Database Migrations ───────────────────────────────────────────────────
  flyway:
    image: flyway/flyway:latest
    container_name: unidocverse-flyway
    command: -connectRetries=60 migrate
    volumes:
      - ./unidocverse-service/migrations/sql:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/unidocverse_db
      - FLYWAY_USER=unidocverse
      - FLYWAY_PASSWORD=unidocverse
      - FLYWAY_CLEAN_DISABLED=true
    depends_on:
      postgres:
        condition: service_healthy

  # ── 3. Ollama LLM Host ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: unidocverse-ollama
    volumes:
      - ollama_storage:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 8192M

  # ── 4. Model Initializer (pulls phi3:mini on first run) ─────────────────────
  ollama-init:
    image: curlimages/curl:latest
    container_name: unidocverse-ollama-init
    volumes:
      - ./init_models.sh:/tmp/init_models.sh:ro
    entrypoint: ["/bin/sh", "/tmp/init_models.sh"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── 5. Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./unidocverse-service
      dockerfile: Dockerfile.backend
    container_name: unidocverse-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=unidocverse_db
      - DB_USER=unidocverse
      - DB_PASSWORD=unidocverse
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=phi3:mini
      - UPLOAD_DIR=/app/storage/uploads
      - PROCESSED_DIR=/app/storage/processed
    ports:
      - "8000:8000"
    volumes:
      - ./unidocverse-service/models:/app/models
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: always
    deploy:
      resources:
        limits:
          memory: 4096M

  # ── 6. Frontend (Angular via Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./unidocverse-dashboard
      dockerfile: Dockerfile.frontend
    container_name: unidocverse-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  ollama_storage:
