# SearxNG bundled with UniDocVerse: local only, JSON output for the Research Agent.
use_default_settings: true
general:
  instance_name: "UniDocVerse web search"
server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "__SECRET__"
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 1
  formats: [html, json]
outgoing:
  request_timeout: 4.0
